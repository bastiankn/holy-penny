name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /holy-penny/preview/ci-check/
          BUILD_COMMIT: ${{ github.sha }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_BASE_PATH: /holy-penny/preview/ci-check/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
